<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AayuSathi - Medical Assistant</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #005A9E;
            --primary-dark: #004080;
            --secondary: #00833D;
            --accent: #D83933;
            --light: #f3f4f6;
            --dark: #1f2937;
        }
        #send-button {
    min-width: 40px;
    border: 1px solid red; /* Temporary for testing */
        }
        .sidebar-toggle {
        z-index: 1000 !important;
            }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: var(--light);
            color: var(--dark);
        }
        
        .chat-container {
            height: calc(100vh - 64px);
            display: flex;
        }
        
        .sidebar {
            background-color: white;
            border-right: 1px solid #e5e7eb;
            width: 300px;
            transition: all 0.3s ease;
        }
        
        .chat-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: #f9fafb;
        }
        
        .chat-header {
            border-bottom: 1px solid #e5e7eb;
            padding: 1rem;
            background-color: white;
        }
        
        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem;
        }
        
        .chat-input {
            border-top: 1px solid #e5e7eb;
            padding: 1rem;
            background-color: white;
        }
        
        .message {
            margin-bottom: 1rem;
            max-width: 80%;
        }
        
        .message.user {
            margin-left: auto;
            background-color: var(--primary);
            color: white;
            border-radius: 1rem 0 1rem 1rem;
        }
        
        .message.assistant {
            background-color: white;
            border-radius: 0 1rem 1rem 1rem;
            border: 1px solid #e5e7eb;
        }
        
        .message.assistant h2 {
            color: #2c3e50;
            font-size: 1.2em;
            margin: 15px 0 10px 0;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 5px;
        }
        
        .message.assistant ul, .message.assistant ol {
            margin: 10px 0;
            padding-left: 20px;
        }
        
        .message.assistant li {
            margin: 5px 0;
        }
        
        .message.assistant strong {
            color: var(--accent);
        }
        
        .source-item {
            background-color: #f3f4f6;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            padding: 0.75rem;
            font-size: 0.875rem;
            border-left: 3px solid var(--secondary);
        }
        
        .chat-item {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #e5e7eb;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chat-item-content {
            flex: 1;
            min-width: 0;
            margin-right: 1rem;
        }
        
        .chat-item-title {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-item-date {
            font-size: 0.75rem;
            color: #4b5563;
            margin-top: 0.25rem;
        }
        
        .chat-item-delete {
            opacity: 1;
            transition: opacity 0.2s ease;
            color: #ef4444;
            padding: 0.25rem;
            border-radius: 0.375rem;
        }
        
        .chat-item:hover .chat-item-delete {
            opacity: 1;
        }
        
        .chat-item-delete:hover {
            background-color: #fee2e2;
        }
        
        .chat-item.active {
            background-color: #f3f4f6;
            border-left: 3px solid var(--primary);
        }
        
        .chat-item.active .chat-item-delete {
            opacity: 1;
        }
        
        .btn-primary {
           color : white;
            background-color: var(--primary);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-dark);
        }
        
        .btn-secondary {
            background-color: var(--secondary);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }
        
        .btn-secondary:hover {
            background-color: #006d32;
        }
        
        .btn-accent {
            background-color: var(--accent);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }
        
        .btn-accent:hover {
            background-color: #b91c1c;
        }
        
        .spinner {
            display: inline-block;
            width: 1.5rem;
            height: 1.5rem;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 64px;
                left: -300px;
                height: calc(100vh - 64px);
                z-index: 999;
            }
            
            .sidebar.open {
                left: 0;
            }
            
            .sidebar-toggle {
                display: block !important;
            }
        }
    </style>
</head>
    
<header class="mb-[5px]">
  <div class="h-20 bg-gradient-to-r from-sky-200 to-sky-600 border-t border-sky-950">
    <div class="max-w-7xl mx-auto px-2 flex justify-between items-center h-full">
      
      <!-- Logo Section -->
      <div class="flex items-center ml-2 my-2">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="AayuSathi Logo" class="h-16 w-auto">
      </div>

      <!-- Profile Button -->
      <div class="mr-2 my-2">
        <button
          id="profile-btn"
          class="flex items-center space-x-3 bg-gray-100 hover:bg-gray-200 px-4 py-3 rounded-full transition-all"        >
          <i class="fas fa-user-circle text-gray-600 text-lg"></i>
          <span id="user-name" class="text-base font-medium">{{ user_profile.name }}</span>
          <i class="fas fa-pencil-alt text-gray-600 text-sm"></i>
        </button>
      </div>

    </div>
  </div>
</header>


    <div class="chat-container">
        <aside class="sidebar">
            <div class="p-4 border-b">
                <button id="new-chat-btn" class="btn-primary w-full flex items-center justify-center">
                    <i class="fas fa-plus mr-2"></i>
                    New Chat
                </button>
            </div>
            <div class="p-4 border-b">
                <h2 class="font-bold text-gray-700">Recent Chats</h2>
            </div>
            <div id="chats-list">
                <!-- Chat list will be populated by JavaScript -->
            </div>
        </aside>
        
        <div class="sidebar-toggle hidden fixed top-20 left-4 z-50 bg-white p-2 rounded-full shadow-md">
            <button id="toggle-sidebar" class="text-gray-700">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        
        <main class="chat-area">
            <div id="welcome-screen" class="flex items-center justify-center h-full flex-col p-6">
                <div class="text-center max-w-md">
                    <img src="{{ url_for('static', filename='img.png') }}" alt="Welcome" class="h-18 w-auto mb-4">
                    <p class="text-gray-600 mb-6">Your personal medical assistant powered by AI. <strong>Ask any health-related questions and get evidence-based answers.</strong></p>
                    <button id="start-chat-btn" class="btn-primary px-6">
                        <i class="fas fa-comment-medical mr-2"></i>
                        Start a New Chat
                    </button>
                    <div class="mt-4 text-sm text-gray-500">
                        <p class="font-bold">Example Questions:</p>
                        <ul class="list-disc list-inside">
                            <li>What are the symptoms of diabetes?</li>
                            <li>How can I lower my blood pressure?</li>
                            <li>What are the side effects of ibuprofen?</li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <div id="chat-interface" class="hidden h-full flex flex-col">
                <div class="chat-header flex justify-between items-center">
                    <div>
                        <h2 id="current-chat-title" class="font-bold">New Chat</h2>
                    </div>
                    <div>
                        <button id="delete-chat-btn" class="text-red-500 hover:text-red-700 p-2">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
                
                <div id="chat-messages" class="chat-messages">
                    <!-- Messages will be populated by JavaScript -->
                </div>
                
                <div class="chat-input">
                    <form id="chat-form" class="flex">
                        <input type="text" id="message-input" class="flex-grow border rounded-l-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="Ask about symptoms, medications, or health concerns...">
                        <button type="submit" id="send-button" class="bg-blue-500 text-white px-4 py-2 rounded-r-lg hover:bg-blue-600">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Profile Modal -->
    <div id="profile-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Your Profile</h2>
                <button id="close-profile-modal" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="profile-form">
                <div class="mb-4">
                    <label for="name-input" class="block text-gray-700 mb-2">Your Name</label>
                    <input type="text" id="name-input" class="border rounded w-full px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" value="{{ user_profile.name }}">
                </div>
                <div class="flex justify-end">
                    <button type="submit" class="btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Scripts -->
    <script>
        marked.setOptions({
            breaks: true,
            gfm: true
        });
        
        document.addEventListener('DOMContentLoaded', function() {
            let currentChatId = null;
            let chats = {};
            
            const welcomeScreen = document.getElementById('welcome-screen');
            const chatInterface = document.getElementById('chat-interface');
            const chatsList = document.getElementById('chats-list');
            const chatMessages = document.getElementById('chat-messages');
            const chatForm = document.getElementById('chat-form');
            const messageInput = document.getElementById('message-input');
            const sendButton = document.getElementById('send-button');
            const newChatBtn = document.getElementById('new-chat-btn');
            const startChatBtn = document.getElementById('start-chat-btn');
            const deleteChatBtn = document.getElementById('delete-chat-btn');
            const currentChatTitle = document.getElementById('current-chat-title');
            const profileBtn = document.getElementById('profile-btn');
            const profileModal = document.getElementById('profile-modal');
            const closeProfileModal = document.getElementById('close-profile-modal');
            const profileForm = document.getElementById('profile-form');
            const nameInput = document.getElementById('name-input');
            const userName = document.getElementById('user-name');
            const toggleSidebar = document.getElementById('toggle-sidebar');
            const sidebar = document.querySelector('.sidebar');
            
            fetchChats();
            
            chatForm.addEventListener('submit', sendMessage);
            newChatBtn.addEventListener('click', createNewChat);
            startChatBtn.addEventListener('click', createNewChat);
            deleteChatBtn.addEventListener('click', deleteCurrentChat);
            profileBtn.addEventListener('click', () => profileModal.classList.remove('hidden'));
            closeProfileModal.addEventListener('click', () => profileModal.classList.add('hidden'));
            profileForm.addEventListener('submit', saveProfile);
            if (toggleSidebar) {
                toggleSidebar.addEventListener('click', () => sidebar.classList.toggle('open'));
            }
            
            function fetchChats() {
                fetch('/api/get_chats')
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            chats = data.chats;
                            renderChatsList();
                        }
                    })
                    .catch(error => console.error('Error fetching chats:', error));
            }
            
            function renderChatsList() {
                chatsList.innerHTML = '';
                const sortedChats = Object.entries(chats).sort((a, b) => new Date(b[1].created_at) - new Date(a[1].created_at));
                if (sortedChats.length === 0) {
                    chatsList.innerHTML = '<div class="p-4 text-gray-500 text-center">No chats yet</div>';
                    return;
                }
                sortedChats.forEach(([id, chat]) => {
                    const chatItem = document.createElement('div');
                    chatItem.className = `chat-item ${id === currentChatId ? 'active' : ''}`;
                    chatItem.dataset.id = id;
                    chatItem.innerHTML = `
                        <div class="chat-item-content" onclick="loadChat('${id}')">
                            <div class="chat-item-title">${chat.title}</div>
                            <div class="chat-item-date">${formatDate(chat.created_at)}</div>
                        </div>
                        <button class="chat-item-delete" onclick="deleteChat('${id}', event)">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    `;
                    chatsList.appendChild(chatItem);
                });
            }
            
            function formatDate(dateString) {
                const date = new Date(dateString);
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }
            
            function formatTimestamp(timestamp) {
                const date = new Date(timestamp);
                return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            }
            
            function createNewChat() {
                for (const [id, chat] of Object.entries(chats)) {
                    if (chat.title === "New Chat" && chat.messages.length === 0) {
                        loadChat(id);
                        return;
                    }
                }
                fetch('/api/new_chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        chats[data.chat_id] = data.chat;
                        loadChat(data.chat_id);
                        renderChatsList();
                    }
                })
                .catch(error => console.error('Error creating new chat:', error));
            }
            
            function loadChat(chatId) {
                if (!chats[chatId]) return;
                currentChatId = chatId;
                currentChatTitle.textContent = chats[chatId].title;
                welcomeScreen.classList.add('hidden');
                chatInterface.classList.remove('hidden');
                document.querySelectorAll('.chat-item').forEach(item => {
                    item.classList.remove('active');
                    if (item.dataset.id === chatId) item.classList.add('active');
                });
                renderMessages(chats[chatId].messages);
                if (window.innerWidth <= 768) sidebar.classList.remove('open');
            }
            
            function renderMessages(messages) {
                chatMessages.innerHTML = '';
                if (!messages || messages.length === 0) return;
                messages.forEach(message => {
                    const messageElement = document.createElement('div');
                    messageElement.className = `message ${message.role} p-4 mb-4`;
                    let messageContent = message.role === 'assistant' ? 
                        `<div>${marked.parse(message.content)}</div>` : 
                        `<p>${message.content}</p>`;
                    if (message.role === 'assistant' && message.sources && message.sources.length > 0) {
                        messageContent += '<div class="mt-3"><h4 class="text-sm font-bold text-gray-600">Sources:</h4><div class="sources mt-2">';
                        message.sources.forEach(source => {
                            messageContent += `
                                <div class="source-item">
                                    <div class="font-bold">${source.title}</div>
                                    <div class="text-xs mt-1">
                                        ${source.authors ? source.authors.slice(0, 3).join(', ') + (source.authors.length > 3 ? ' et al.' : '') : 'Unknown authors'} 
                                        ${source.year ? `(${source.year})` : ''}
                                    </div>
                                    ${source.journal ? `<div class="text-xs italic">${source.journal}</div>` : ''}
                                    ${source.tldr ? `<div class="mt-1 text-sm">${source.tldr}</div>` : ''}
                                </div>
                            `;
                        });
                        messageContent += '</div></div>';
                    }
                    messageElement.innerHTML = `
                        ${messageContent}
                        <div class="text-xs text-gray-500 mt-1">${formatTimestamp(message.timestamp)}</div>
                    `;
                    chatMessages.appendChild(messageElement);
                });
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
            
            function sendMessage(e) {
                e.preventDefault();
                if (!currentChatId) {
                    createNewChat();
                    return;
                }
                const message = messageInput.value.trim();
                if (!message) return;
                messageInput.value = '';
                sendButton.disabled = true;
                sendButton.innerHTML = '<div class="spinner"></div>';
                const userMessage = {
                    role: 'user',
                    content: message,
                    timestamp: new Date().toISOString()
                };
                chats[currentChatId].messages.push(userMessage);
                renderMessages(chats[currentChatId].messages);
                fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, chat_id: currentChatId })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        fetch(`/api/get_chat?chat_id=${currentChatId}`)
                            .then(response => response.json())
                            .then(chatData => {
                                if (chatData.success) {
                                    chats[currentChatId] = chatData.chat;
                                    currentChatTitle.textContent = chatData.chat.title;
                                    renderMessages(chatData.chat.messages);
                                    renderChatsList();
                                }
                            });
                    } else {
                        const errorMessage = {
                            role: 'assistant',
                            content: `Sorry, I encountered an error: ${data.error}`,
                            timestamp: new Date().toISOString()
                        };
                        chats[currentChatId].messages.push(errorMessage);
                        renderMessages(chats[currentChatId].messages);
                    }
                })
                .catch(error => {
                    const errorMessage = {
                        role: 'assistant',
                        content: 'Sorry, I encountered an error processing your request. Please try again.',
                        timestamp: new Date().toISOString()
                    };
                    chats[currentChatId].messages.push(errorMessage);
                    renderMessages(chats[currentChatId].messages);
                })
                .finally(() => {
                    sendButton.disabled = false;
                    sendButton.innerHTML = '<i class="fas fa-paper-plane"></i>';
                });
            }
            
            function deleteCurrentChat() {
                if (!currentChatId) return;
                if (confirm('Are you sure you want to delete this chat?')) {
                    fetch('/api/delete_chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: currentChatId })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            delete chats[currentChatId];
                            currentChatId = null;
                            welcomeScreen.classList.remove('hidden');
                            chatInterface.classList.add('hidden');
                            renderChatsList();
                        }
                    })
                    .catch(error => console.error('Error deleting chat:', error));
                }
            }
            
            function saveProfile(e) {
                e.preventDefault();
                const name = nameInput.value.trim();
                if (!name) return;
                fetch('/api/save_profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        userName.textContent = name;
                        profileModal.classList.add('hidden');
                    }
                })
                .catch(error => console.error('Error saving profile:', error));
            }
            
            function deleteChat(chatId, event) {
                event.preventDefault();
                event.stopPropagation();
                if (confirm('Are you sure you want to delete this chat?')) {
                    fetch('/api/delete_chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: chatId })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            delete chats[chatId];
                            if (currentChatId === chatId) {
                                currentChatId = null;
                                welcomeScreen.classList.remove('hidden');
                                chatInterface.classList.add('hidden');
                            }
                            renderChatsList();
                        }
                    })
                    .catch(error => console.error('Error deleting chat:', error));
                }
            }
            
            window.loadChat = loadChat;
        });
    </script>
</body>
</html>
